# Experiment 2: MiT-B2 UNet with improved imbalance handling
# focal_alpha=0.75, weighted sampler, change-aware cropping.

data:
  root: "data/"
  patch_size: 512
  num_workers: 4
  use_weighted_sampler: true

model:
  encoder_name: "mit_b2"
  encoder_weights: "imagenet"
  in_channels: 4
  classes: 1

training:
  epochs: 50
  batch_size: 8
  learning_rate: 0.0002
  weight_decay: 0.0001
  optimizer: "adamw"
  seed: 42
  dice_weight: 1.0
  focal_weight: 1.0
  focal_alpha: 0.75
  focal_gamma: 2.0
  scheduler: "cosine"

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotate_90: true
  brightness_contrast: true

paths:
  checkpoint_dir: "outputs/exp2/checkpoints/"
  log_dir: "outputs/exp2/logs/"
  eval_output_dir: "outputs/exp2/evals/"
