# Experiment 6: ResNet-34 with SAR instance normalisation + channel dropout
#
# Builds on Experiment 3 (best test generalisation so far: Test F1=0.0363).
# Two targeted changes that directly attack the geographic domain shift root cause:
#
#   1. sar_instance_norm: normalise each SAR patch to zero-mean/unit-variance
#      instead of /255. Removes scene-level brightness offsets — the primary
#      mechanism of SAR domain shift across geographic events.
#
#   2. channel_dropout_prob=0.1: randomly zero out EO or SAR for 10% of batches.
#      Forces the model to learn useful representations from either modality alone,
#      improving robustness when one channel exhibits domain shift.
#
# Other changes vs Exp3:
#   - continuous ±45 deg rotation added (already proven harmless in Exp4)
#   - stronger SAR speckle noise (0.5 prob, 0.3 scale)
#   - 60 epochs (Exp3 best checkpoint was at epoch 49 → not converged)

data:
  root: "data/"
  patch_size: 512
  num_workers: 4
  use_weighted_sampler: true
  no_change_sample_weight: 0.05

model:
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 4
  classes: 1

training:
  epochs: 60
  batch_size: 32
  learning_rate: 0.0004
  weight_decay: 0.0001
  optimizer: "adamw"
  seed: 42
  dice_weight: 1.0
  focal_weight: 1.0
  focal_alpha: 0.75
  focal_gamma: 2.0
  scheduler: "cosine"

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotate_90: true
  use_rotate: true # ±45 deg continuous rotation (added vs Exp3)
  brightness_contrast: true
  sar_noise_prob: 0.5 # stronger than Exp4 (was 0.4)
  sar_noise_scale: 0.3 # wider noise envelope (was 0.2)
  sar_instance_norm: true # per-image IN on SAR channel
  channel_dropout_prob: 0.1 # modality dropout 10% of samples

paths:
  checkpoint_dir: "outputs/exp6/checkpoints/"
  log_dir: "outputs/exp6/logs/"
  eval_output_dir: "outputs/exp6/evals/"
