# Experiment 3: ResNet-34 UNet with improved imbalance handling
# Ablation control — matches Experiment 2 training settings with CNN encoder.
# Best test generalization (Test F1: 0.0363).

data:
  root: "data/"
  patch_size: 512
  num_workers: 2
  use_weighted_sampler: true

model:
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 4
  classes: 1

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0004
  weight_decay: 0.0001
  optimizer: "adamw"
  seed: 42
  dice_weight: 1.0
  focal_weight: 1.0
  focal_alpha: 0.75
  focal_gamma: 2.0
  scheduler: "cosine"

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotate_90: true
  brightness_contrast: true

paths:
  checkpoint_dir: "outputs/exp3/checkpoints/"
  log_dir: "outputs/exp3/logs/"
  eval_output_dir: "outputs/exp3/evals/"
