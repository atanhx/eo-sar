[project]
name = "eo-sar"
version = "0.1.0"
description = "EO-SAR: Evaluating domain shift for building segmentation"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "albumentations>=2.0.8",
    "huggingface-hub>=1.14.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "segmentation-models-pytorch>=0.5.0",
    "tifffile>=2026.5.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126" # to be compatible with sm50, sm60 arch.
explicit = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length 
    "B006",   # mutable default arg acceptable in config defaults
    "UP007",  # keep Union[] for broader compatibility
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
